# JVM memory for Gradle (Flutter + Kotlin + Firebase need more heap; avoid Jetifier OOM).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# Disable Jetifier; Flutter and Firebase already use AndroidX (avoids JetifyTransform heap usage).
android.enableJetifier=false
