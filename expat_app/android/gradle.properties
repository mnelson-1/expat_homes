# JVM memory for Gradle (increased Metaspace to avoid OutOfMemoryError: Metaspace with Kotlin/Android).
# Serial GC uses less virtual address space; one worker reduces total memory use.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=64m -XX:+UseSerialGC -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
android.useAndroidX=true
android.enableJetifier=true
