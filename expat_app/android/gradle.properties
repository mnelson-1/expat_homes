# Kotlin incremental compile breaks when the project (e.g. D:\) and Pub cache (e.g. C:\) are on
# different Windows drive roots — daemon fails closing incremental caches ("different roots").
kotlin.incremental=false

# JVM memory: a very large -Xmx can worsen native OOM on Windows (C2 compiler malloc) after a long-lived daemon.
# 2g is enough for most assembleDebug runs; raise only if Gradle reports Java heap space errors.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m
android.useAndroidX=true
# Disable Jetifier; Flutter and Firebase already use AndroidX (avoids JetifyTransform heap usage).
android.enableJetifier=false
